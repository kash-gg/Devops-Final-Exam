apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    exam-day/owner: exam-day
  name: payment-backend
  labels:
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: backend
  template:
    metadata:
      labels:
        tier: backend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    exam-day/owner: exam-day
  name: payment-backend
  labels:
    tier: backend
spec:
  type: NodePort
  selector:
    tier: backend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30199


